name: Build manylinux wheels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mkl-service:
    uses: ./.github/workflows/wheels.yml
    with:
      name: mkl-service
      repo: IntelPython/mkl-service
      force-build: true

  numpy:
    uses: ./.github/workflows/wheels.yml
    with:
      name: numpy
      repo: numpy/numpy
      force-build: true
    needs: mkl-service

  scipy:
    uses: ./.github/workflows/wheels.yml
    with:
      name: scipy
      repo: scipy/scipy
      force-build: true
    needs: [mkl-service, numpy]
