name: Link external dependencies

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "15 21 * * 3" # 21.15 UTC every Wednesday

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pypi
          path: pypi
          persist-credentials: true  # Need credentials to push.

      - name: Update external links
        run: |
          main/tools/link_pypi pypi/

      - name: Commit index
        id: commit
        working-directory: pypi
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
              echo "No changes to commit"
              exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "ci: Update external links"
          git push origin HEAD:pypi
          echo "pushed=true" >>$GITHUB_OUTPUT

      - name: Wait for index deployment
        if: steps.commit.outputs.pushed == 'true'
        run: |
          # Pushing to 'pypi' only queues the Pages build. Wait until the new index is
          # actually served, so that a build chained after this workflow resolves against
          # it. Poll a file this commit changed, so the check can't pass on stale content.
          file=$(git -C pypi show --name-only --format= HEAD | head -1)
          url="https://urob.github.io/numpy-mkl/${file%/index.html}/"
          for _ in $(seq 60); do
            if served=$(curl -sSf -H 'Cache-Control: no-cache' "$url") \
                && [[ "$served" == "$(cat "pypi/${file}")" ]]; then
              echo "Index is live: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Updated index was not served within 10 minutes"
          exit 1
