name: Wheels

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: "Package to build (numpy, scipy, mkl-service)"
      repo:
        required: true
        type: string
        description: "Source repo (numpy/numpy, scipy/scipy, IntelPython/mkl-service)"
      force-build:
        required: false
        type: boolean
        description: "Force build even if wheels exist"
      version:
        required: false
        type: string
        description: "Version to build (default: latest release)"

jobs:
  meta:
    if: github.repository == 'urob/numpy-mkl'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.tag }}
      version: ${{ env.version }}
      matrix: ${{ env.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Fetch build matrix
        run: |
          uv run tools/fetch_matrix2 ${{ inputs.name }} --config ci-targets.yaml \
            --store build.json --token ${{ secrets.GITHUB_TOKEN }} \
            ${{ inputs.force-build && '--force-build' || '' }} >matrix.json

          echo "tag=$(jq -rc '."tag"' matrix.json)" >>$GITHUB_ENV
          echo "version=$(jq -rc '."version"' matrix.json)" >>$GITHUB_ENV
          echo "matrix=$(jq -c '."matrix"' matrix.json)" >>$GITHUB_ENV

          cat matrix.json | yq -P -o yaml

  #-----------------------------------------------------------------------------------------------
  build:
    name: ${{ inputs.name }}-${{ matrix.python_version }} (${{ matrix.runner }})
    needs: meta
    if: ${{ needs.meta.outputs.matrix != 'null' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
      fail-fast: false
    continue-on-error: true # Release all successful builds, even if some platforms fail.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.meta.outputs.tag }}
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Prepare environment
        run: |
          # Need this since pyproject.toml doesn't apply to $SRC_DIR.
          echo "UV_PYTHON_PREFERENCE=only-managed" >>$GITHUB_ENV

          case "${{ runner.os }}" in
            Linux) echo "venv_bin=bin" >>$GITHUB_ENV ;;
            Windows) echo "venv_bin=Scripts" >>$GITHUB_ENV ;;
          esac

          # Move src to avoid pyproject conflicts. SRC_DIR is set relative to GITHUB_WORKSPACE to
          # preserve the "D:\" prefix on Windows. (Pure Linux paths aren't supported as arguments
          # to 'working-directory'.)
          mv src ../../ && echo "SRC_DIR=${GITHUB_WORKSPACE}/../../src" >>$GITHUB_ENV

          # Path to MKL sources, referenced in the final build.
          echo "MKL_VENV=$(realpath "${GITHUB_WORKSPACE}"/../../mkl)" >>$GITHUB_ENV

          # Dedicated environment for the 'build-deps' group. Kept out of the workspace and
          # passed as UV_PROJECT_ENVIRONMENT only to the steps that use the group, so that
          # syncing it can never clobber (or be clobbered by) another venv.
          echo "BUILD_VENV=$(realpath "${GITHUB_WORKSPACE}"/../../build-deps)" >>$GITHUB_ENV

      - name: Set up python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python_version }}
          version-file: "pyproject.toml"
          enable-cache: false

      - name: Install MKL libraries
        run: |
          # Prevent using future MKL versions, which may not be backward compatible.
          RELEASE_YEAR=$(git -C "${{ env.SRC_DIR }}" log -1 --format=%cd --date=format:%Y)

          uv venv "${{ env.MKL_VENV }}"
          source "${{ env.MKL_VENV }}/${{ env.venv_bin }}"/activate
          uv pip install "mkl-devel<$((RELEASE_YEAR + 1)).0.0"

          # Get exact MKL version.
          echo "MKL_VERSION=$(uv pip show mkl | grep '^Version' | sed 's/Version: //')" \
              >>$GITHUB_ENV

          # Get pkg-config path (numpy, scipy).
          echo "PKG_CONFIG_PATH=$(python tools/get_file_in_pkg mkl-sdl.pc \
              --pkg mkl-devel --parent)" >>$GITHUB_ENV

          # Get CMake package path (mkl-service). MKL_DIR is where CMake's find_package looks
          # for MKLConfig.cmake.
          echo "MKL_DIR=$(python tools/get_file_in_pkg MKLConfig.cmake \
              --pkg mkl-devel --parent)" >>$GITHUB_ENV

          # Fetch MKL license.
          cat "$(python tools/get_file_in_pkg LICENSE.txt --pkg mkl-devel)" \
              >>"${GITHUB_WORKSPACE}/patches/LICENSE_MKL.txt"

          # Add .so -> .so.* symlinks to fix linking for mkl-service.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cd "${{ env.MKL_VENV }}"/lib
            for i in libmkl*.so.*; do ln -s $i ${i%.*}; done
          fi

      - name: Apply patches
        run: |
          # Apply patches, if the package has any.
          cd "${{ env.SRC_DIR }}"
          shopt -s nullglob
          patches=("${GITHUB_WORKSPACE}"/patches/${{ inputs.name }}/*.patch)
          [[ ${#patches[@]} -eq 0 ]] || git apply "${patches[@]}"

          # Swap in our own import-time hook, which locates MKL through the installed
          # 'mkl' package instead of assuming a Windows venv layout. This relies on
          # _init_helper getting imported, so we assert first that it is.
          if [[ "${{ inputs.name }}" == "mkl-service" ]]; then
            grep -q '^from \. import _init_helper$' mkl/__init__.py ||
                { echo "::error::mkl-service no longer imports _init_helper"; exit 1; }
            cp "${GITHUB_WORKSPACE}"/patches/mkl-service/_init_helper.py mkl/
          fi

          # Fix MKL pkg-config on Windows.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "${GITHUB_WORKSPACE}"/patches/mkl/*.pc "${PKG_CONFIG_PATH}/"
          fi

      - name: Add MKL to runtime dependencies
        working-directory: ${{ env.SRC_DIR }}
        run: |
          # Pin runtime library to the exact version used for compiling.
          MAJOR=$(echo "$MKL_VERSION" | cut -d. -f1)
          if [[ "${{ inputs.name }}" == "mkl-service" ]]; then
            # Use --frozen (implies --no-sync) to skip re-locking, which would make meson-python
            # configure the whole project just to resolve the dynamic version.
            uv add --frozen "mkl>=${MKL_VERSION},<$((MAJOR + 1)).0.0"
          else
            uv add --no-sync "mkl>=${MKL_VERSION},<$((MAJOR + 1)).0.0" mkl-service
          fi

      - name: Add MKL licence
        working-directory: ${{ env.SRC_DIR }}
        run: |
          echo "" >>LICENSE.txt
          echo "----" >>LICENSE.txt
          echo "" >>LICENSE.txt
          [[ "${{ inputs.name }}" == "scipy" ]] && cat LICENSES_bundled.txt >>LICENSE.txt
          cat "${GITHUB_WORKSPACE}/patches/LICENSE_MKL.txt" >>LICENSE.txt
        if: inputs.name != 'mkl-service'

      - name: Install Windows build dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          # Use ';;&' so that every subsequent pattern is re-tested.
          case "${{ inputs.name }}" in
            numpy | scipy)
              # Pkg-config is required for numpy and scipy. Sourced from PyPI (pinned via
              # uv.lock) rather than chocolatey, whose SourceForge download intermittently
              # times out. Point meson at the bundled binary directly: the package's
              # 'pkg-config' console script silently no-ops when PKG_CONFIG_PATH is set.
              echo "PKG_CONFIG=$(uv run --frozen --only-group build-deps \
                  python -c 'import pkgconf; print(pkgconf.get_executable())')" >>$GITHUB_ENV
              ;;&
            scipy)
              # Gcc is required for scipy. Rtools45 (gcc 14) matches upstream's wheel builder.
              choco install rtools -y --no-progress --force --version=4.5.6768
              echo "c:\rtools45\ucrt64\bin;" >>$GITHUB_PATH
              ;;&
          esac
        if: runner.os == 'windows'

      - name: Build wheel
        working-directory: ${{ env.SRC_DIR }}
        run: |
          case "${{ inputs.name }}" in
            numpy)
              args="-Csetup-args=-Dblas=mkl-sdl \
                    -Csetup-args=-Dlapack=mkl-sdl \
                    -Csetup-args=-Dallow-noblas=false \
                    -Csetup-args=-Dcpu-baseline=F16C \
                    -Csetup-args=-Dcpu-dispatch=AVX512_ICL"
              [[ "${{ runner.os }}" == "Windows" ]] && args="${args} -Csetup-args=--vsenv"
              ;;

            scipy)
              # MSVC is unable to compile Pythran, use gcc or set -Duse-pythran=false.
              args="-Csetup-args=-Dblas=mkl-sdl \
                    -Csetup-args=-Dlapack=mkl-sdl \
                    -Csetup-args=-Duse-g77-abi=true"
              ;;

            'mkl-service')
              # Built with meson-python; MKL is located through its CMake package
              # config, i.e. via $MKL_DIR.
              args="--no-build-isolation"
              case "${{ runner.os }}" in
                # Force MSVC; meson prefers any gcc on PATH over falling back to VS.
                Windows) args="${args} -Csetup-args=--vsenv" ;;
              esac
              uv venv buildenv && source buildenv/"${{ env.venv_bin }}"/activate
              uv pip install meson-python ninja cmake cython
              ;;
          esac
          uv build --wheel --index https://urob.github.io/numpy-mkl ${args}

      - name: Repair wheel (Linux)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          mkdir -p wheelhouse
          plat="$(ldd --version | head -1 | awk '{ print $NF }' | tr '.' '_')_$(uname -m)"
          uv run --frozen --only-group build-deps \
              auditwheel repair "${{ env.SRC_DIR }}"/dist/*.whl -w wheelhouse \
              --exclude 'libmkl*' --plat=manylinux_${plat}
        if: runner.os == 'linux'

      - name: Repair wheel (Windows)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.BUILD_VENV }}
        run: |
          mkdir -p wheelhouse
          uv run --frozen --only-group build-deps \
              delvewheel repair "${{ env.SRC_DIR }}"/dist/*.whl -w wheelhouse \
              --exclude mkl_rt.*.dll --exclude libsf_error_state.dll
        if: runner.os == 'windows'

      - name: Run tests
        run: |
          # Make sure we don't pick up the development MKL libraries.
          rm -rf "${{ env.MKL_VENV }}"

          # Set up test environment.
          uv venv testenv && source testenv/"${{ env.venv_bin }}"/activate
          uv pip install wheelhouse/*.whl --index https://urob.github.io/numpy-mkl

          case "${{ inputs.name }}" in
            numpy)
              uv pip install -r "${{ env.SRC_DIR }}"/requirements/test_requirements.txt
              uv pip install threadpoolctl
              python tools/numpy_tests.py
              ;;

            scipy)
              # Only install essential test dependencies, mirroring official wheel builder.
              # Installing the full set below needs 'dnf -y install libmpc-devel' on py314,
              # as gmpy2 has no pre-built wheels there and falls back to building from source.
              uv pip install pytest pytest-xdist threadpoolctl pooch hypothesis
              # uv pip install -r "${{ env.SRC_DIR }}"/requirements/test.txt \
              #     --index https://urob.github.io/numpy-mkl
              python tools/scipy_tests.py
              ;;

            mkl-service)
              uv pip install pytest
              pytest -s -v --pyargs mkl
              ;;
          esac

      - name: Store build information
        run: |
          cat >wheelhouse/versions-${{ matrix.python_version}}-${{ runner.os }}.json <<EOF
          {
            "name": "${{ inputs.name }}",
            "version": "${{ needs.meta.outputs.version }}",
            "python": "${{ matrix.python_version }}",
            "os": "${{ runner.os }}",
            "mkl": "${{ env.MKL_VERSION }}"
          }
          EOF

      - name: Archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-${{ matrix.python_version }}-${{ runner.os }}
          path: |
            wheelhouse/*.whl
            wheelhouse/*.json
          retention-days: 1

  #-----------------------------------------------------------------------------------------------
  release:
    needs: [meta, build]
    if: ${{ needs.meta.outputs.matrix != 'null' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicitly set ref to include commits from the meta job.
          # https://github.com/actions/checkout/issues/439#issuecomment-830862188
          ref: main
          persist-credentials: true  # Need credentials to push.

      - name: Checkout deployment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pypi
          path: pypi
          persist-credentials: true  # Need credentials to push.

      - name: Set up python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version-file: "pyproject.toml"

      - name: Fetch wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.name }}-*
          path: release
          merge-multiple: true

      - name: Bump project version
        run: |
          uv version --bump patch
          echo "VERSION=$(uv version --short)" >>$GITHUB_ENV

      - name: Store build metadata
        run: |
          tools/store_info.py release/*.json --store build.json

      - name: Update badges
        run: |
          tools/update_icons README.md --store build.json

      - name: Commit release data
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
              echo "No changes to commit"
              exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "ci: Prepare release for ${{ inputs.name }}-${{ needs.meta.outputs.version }}"
          git push origin HEAD:main

      - name: Write release notes
        run: |
          uv run tools/release_notes templates/release.md --store build.json >release/release.md

      - name: Release wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" --title "${VERSION}" --notes-file release/release.md release/*.whl

      - name: Generate index
        run: |
          # Wait 10s for release to get finished.
          sleep 10
          uv run tools/make_index2 pypi/${{ inputs.name}}/index.html --token ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy index
        working-directory: pypi
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
              echo "No changes to commit"
              exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "ci: Add wheels for ${{ inputs.name }}-${{ needs.meta.outputs.version }}"
          git push origin HEAD:pypi

...
